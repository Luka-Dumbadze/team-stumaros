# HW2 tool golden set · my_open_tasks · owner: UrjuHub
# Runs in CI through tests/test_tool_golden.py: no model, no key.
tool_owner: UrjuHub
cases:
  - id: r1
    type: normal
    why: verified active room can read its own open tasks list (empty or with its own tasks)
    tool: my_open_tasks
    caller: "204"
    arguments: {}
    expect: ok
    result_has: {room: "204"}
  - id: r2
    type: normal
    why: visitor (no verified room) is never offered a room-scoped tool
    tool: my_open_tasks
    caller: null
    arguments: {}
    expect: refused
    error_has: [no tool named]
 - id: r3
    type: normal
    why: unverified or checked-out room is rejected because no guest is checked in today
    tool: my_open_tasks
    caller: "305"
    arguments: {}
    expect: refused
    error_has: [checked in today]
  - id: b1
    type: bad-input
    why: unexpected unknown argument is rejected by extra="forbid"
    tool: my_open_tasks
    caller: "204"
    arguments: {unexpected_field: "abc"}
    expect: refused
    error_has: [invalid arguments]
  - id: a1
    type: adversarial
    why: caller identity cannot be overridden via arguments to read another room's tasks
    tool: my_open_tasks
    caller: "204"
    arguments: {room: "410"}
    expect: refused
    error_has: [invalid arguments, room]
